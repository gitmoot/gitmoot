name: CI

# THROWAWAY (#2360 / PR #2376): hosted, verbose, named run of the descriptor-seal
# kernel tests only. This branch is never merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fdseal-kernel:
    name: fd-seal kernel tests (verbose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Kernel facts
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
          git log -1 --format='%H %s'
      - name: Descriptor-seal kernel tests (as root, verbose, 3x)
        shell: bash
        run: >-
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags e2e -count=3 -v -timeout 15m
          -run 'TestInheritedAuthorityDescriptorIsWritableWithoutTheLauncher|TestManagedLaunch|TestNoExecutionSandbox'
          ./internal/sandbox/
