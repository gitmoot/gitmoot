name: CI

# THROWAWAY (#2364): hosted, verbose, named run of the no-execution sandbox
# kernel tests only. This branch is never merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  noexec-kernel:
    name: no-execution kernel tests (verbose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Kernel facts
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
          git log -1 --format='%H %s'
      - name: No-execution sandbox kernel tests (as root, verbose)
        shell: bash
        run: >-
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          go test -tags e2e -count=1 -v -timeout 10m -run 'TestNoExecutionSandbox' ./internal/sandbox/
