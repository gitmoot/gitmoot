name: Producer cleanup verification

on:
  push:
    branches: [verify/2358-hosted]

permissions:
  contents: read

concurrency:
  group: producer-cleanup-verification
  cancel-in-progress: true

env:
  TARGET_SHA: c2a8340e578e053881e495cb24be830ed66a94c6
  GOTOOLCHAIN: local
  GOMAXPROCS: '2'

jobs:
  smoke:
    name: Exact-head native CLI and daemon smoke
    if: ${{ !contains(github.event.head_commit.message, '[capacity-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: instruments
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: source/go.sum
      - name: Run real isolated processes as root
        run: >-
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          python3 instruments/verify.py source evidence smoke
      - name: Export redacted portable receipts
        if: always()
        run: sudo -E python3 instruments/export.py evidence exported
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-native-smoke-${{ env.TARGET_SHA }}
          path: exported
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-review-kit-${{ env.TARGET_SHA }}
          path: review-kit.tar.gz
          if-no-files-found: error
          retention-days: 30

  proofs:
    name: Regression proofs (${{ matrix.package }}, ${{ matrix.base_name }})
    # An instrument-only retry reuses the completed proofs at the same TARGET_SHA.
    if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        package: [cli, db, workflow]
        base_name: [original, corrections, review]
        include:
          - package: workflow
            base_name: review2
    steps:
      - uses: actions/checkout@v4
        with:
          path: instruments
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: source/go.sum
      - name: Prove every changed test in this package
        env:
          PROOF_PACKAGE: ${{ matrix.package }}
          PROOF_BASE: ${{ matrix.base_name }}
        run: >-
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          python3 instruments/verify.py source evidence proofs
      - name: Export redacted portable receipts
        if: always()
        run: sudo -E python3 instruments/export.py evidence exported
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-proofs-${{ matrix.package }}-${{ matrix.base_name }}-${{ env.TARGET_SHA }}
          path: exported
          if-no-files-found: error
          retention-days: 30

  mutations:
    name: Review guard regression mutations
    if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          path: instruments
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: source/go.sum
      - name: Prove guard regressions from passing baselines
        run: >-
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)"
          python3 instruments/verify.py source evidence mutations
      - name: Export redacted portable receipts
        if: always()
        run: sudo -E python3 instruments/export.py evidence exported
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-review-mutations-${{ env.TARGET_SHA }}
          path: exported
          if-no-files-found: error
          retention-days: 30

  website:
    name: Exact-head website build
    if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: instruments
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/website/package-lock.json
      - name: Build documentation without publishing
        run: python3 instruments/verify.py source evidence website
      - name: Export redacted portable receipts
        if: always()
        run: sudo -E python3 instruments/export.py evidence exported
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-website-${{ env.TARGET_SHA }}
          path: exported
          if-no-files-found: error
          retention-days: 30

  focused-capacity:
    name: Cold focused package capacity measurement
    if: ${{ contains(github.event.head_commit.message, '[capacity-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: instruments
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: source/go.sum
      - name: Measure offline build with empty private caches
        run: python3 instruments/measure-focused-build.py source evidence
      - name: Export redacted portable receipts
        if: always()
        run: python3 instruments/export.py evidence exported
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-focused-capacity-${{ env.TARGET_SHA }}
          path: exported
          if-no-files-found: error
          retention-days: 30
